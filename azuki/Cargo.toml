[package]
name = "azuki"
version = "2.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A minimalist parser generator for Rust."
repository = "https://github.com/kylejlin/azuki"
keywords = ["parser", "generator", "LALR", "grammar"]
categories = ["parsing"]
readme = "../README.md"

[dependencies]
sha256 = "1.6.0"
logos = "0.16.1"

[build-dependencies]
# Pin the published bootstrap version so later releases cannot depend on themselves.
azuki = "=1.0.0"
walkdir = "2"
