[package]
name = "azuki"
version = "3.1.0"
edition = "2024"
rust-version = "1.98"
description = "A minimalist parser generator for Rust."
readme = "../README.md"
repository = "https://github.com/kylejlin/azuki"
license = "MIT"
keywords = ["LALR", "generator", "grammar", "parser"]
categories = ["parsing"]

[dependencies]
logos = "0.16.1"
sha256 = { version = "1.6.0", default-features = false }

[build-dependencies]
# Pin the published bootstrap version so later releases cannot depend on themselves.
azuki = "=1.0.0"
walkdir = "2"
